plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'app'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '21'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	
	implementation 'io.reactivex:rxjava:1.3.8' // Updated to latest 1.x
	implementation group: 'net.sourceforge.javacsv', name: 'javacsv', version: '2.0'
	
	// Updating Hazelcast to 5.x for Spring Boot 3 compatibility
	implementation 'com.hazelcast:hazelcast:5.5.0'
	implementation 'com.hazelcast:hazelcast-spring:5.5.0'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.projectreactor:reactor-test'
}

test {
	useJUnitPlatform()
}

springBoot {
	mainClass = 'market.MarketDataApplication'
}
